<p>
  秋季的皇宫，枫叶正红。草坪金黄，像一张温暖的地毯，看上去很舒服。日本皇宫，周围就是大片的树林和草坪，
  还有护城河，围着皇宫跑步的人群络绎不绝。这是一个休闲散步的好地方。
</p>
