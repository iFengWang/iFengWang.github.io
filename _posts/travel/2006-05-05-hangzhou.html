<p>一夜软卧，清晨到达杭州。这是我第一次出差，所以很兴奋。还记得看着车窗外的沿途风光，体验江南水乡，到处都是郁郁葱葱的一片绿色，心情大好！工作完事之后，项目方陪同一起浏览了西湖，但当时
  照的照片找不到了，所以只能文字记录一下了。
</p>
