<p>
  从浅草码头登船，一路观赏两岸风景，大约经过70分钟左右，经过一座雄伟的大桥，就到达了台场海滨公园，这里大人小孩
  都很放松惬意，孩子们玩水不意乐乎同，大人们坐在沙滩上、树荫下谈笑，东京湾里的一小片乐士。
</p>
