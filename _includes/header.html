<!-- Header -->
<header id="header"{% if page.layout == 'landing' %} class="alt"{% endif %}>

  <div class="title-layout">
    <a href="{{ site.baseurl }}/index.html">
      <img src="{{ site.baseurl }}/images/config/logo.png" class="mylogo-small" />
    </a>
    <h1>{{ site.title }}</h1>
  </div>

  <div class="header-controls">
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
      <span class="sun-icon">☀️</span>
      <span class="moon-icon">🌙</span>
    </button>

    <!-- Language Switcher -->
    {% include language-switcher.html %}
    
    <!-- Menu Toggle -->
    <button class="menu-toggle" aria-label="菜单">
      <a href="#menu" class="menuToggle">
        <span class="menu-icon">≡</span>
      </a>
    </button>
  </div>
  
  <nav id="nav">
    <ul>
      <li class="special">
        <div id="menu">
          <ul>
            <li><a href="/">✧博客首页</a></li>
            {% for link in site.data.navigation %}
            <li><a href="{{ site.baseurl }}{{ link.url }}">✧{{ link.title }}</a></li>
            {% endfor %}
          </ul>
          <div class="rcodePanel">
            <img src="{{ site.baseurl }}/images/config/rcode.png" style="width: 50%;"/>
          </div>
        </div>
      </li>
    </ul>
  </nav>
</header>
