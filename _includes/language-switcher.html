<!-- Language Switcher -->
<div class="language-switcher">
  <div class="language-dropdown">
    <button class="language-toggle" id="languageToggle">
      <span class="current-lang" id="currentLang">🇨🇳</span>
      <i class="fa fa-chevron-down"></i>
    </button>
    <div class="language-menu" id="languageMenu">
      <a href="#" class="language-option" data-lang="zh" data-flag="🇨🇳">🇨🇳</a>
      <a href="#" class="language-option" data-lang="en" data-flag="🇺🇸">🇺🇸</a>
      <a href="#" class="language-option" data-lang="ja" data-flag="🇯🇵">🇯🇵</a>
    </div>
  </div>
</div>
