<!-- Language Switcher -->
<div class="language-switcher">
  <div class="language-dropdown">
    <button class="language-toggle" id="languageToggle">
      <span class="current-lang" id="currentLang">中文</span>
      <i class="fa fa-chevron-down"></i>
    </button>
    <div class="language-menu" id="languageMenu">
      <a href="#" class="language-option" data-lang="zh" data-flag="🇨🇳">中文</a>
      <a href="#" class="language-option" data-lang="en" data-flag="🇺🇸"
        >English</a
      >
      <a href="#" class="language-option" data-lang="ja" data-flag="🇯🇵"
        >日本語</a
      >
    </div>
  </div>
</div>
